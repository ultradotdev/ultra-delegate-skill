name: Tests and release packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python .agents/skills/ultra-delegation/scripts/jev_docs.py --check
      - run: python .agents/skills/ultra-delegation/scripts/pilot_questions.py --check
      - run: python .agents/skills/ultra-delegation/scripts/capability_index.py --check
      - run: python scripts/build_release.py --check
      - run: python scripts/build_release.py --source --check
      - run: python scripts/build_release.py --output-dir dist
      - run: python scripts/build_release.py --source --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-delegation-${{ matrix.python-version }}
          path: dist/ultra-delegat*-*

  optional-keyring:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "keyring>=25,<26"
      - run: python -m unittest discover -s tests -p test_release_packaging.py -v

  repository-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
      - run: rustc --version
      - run: python -m unittest discover -s tests -p test_pilot_fixtures.py -v
